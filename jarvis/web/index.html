<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
:root {
  --fondo: #070b16;
  --panel: #0d1424;
  --panel-2: #121b30;
  --borde: #1e2a44;
  --texto: #e6ecf8;
  --tenue: #8b97b3;
  --acento: #3fd0ff;
  --acento-2: #7c6bff;
  --ok: #3ee08f;
  --aviso: #ffcc4d;
  --error: #ff6b7d;
  --usuario: #17325a;
  --radio: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(1200px 700px at 70% -10%, #13204000 0%, #0f1a36 0%, var(--fondo) 60%);
  color: var(--texto);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  display: grid;
  grid-template-columns: 300px 1fr;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }

/* ---------- barra lateral ---------- */
aside {
  background: linear-gradient(180deg, var(--panel) 0%, #0a1020 100%);
  border-right: 1px solid var(--borde);
  display: flex; flex-direction: column; gap: 18px;
  padding: 22px 18px;
  overflow-y: auto;
}
.marca { display: flex; align-items: center; gap: 12px; }
.marca h1 { font-size: 20px; letter-spacing: .28em; margin: 0; font-weight: 700; }
.marca small { display: block; color: var(--tenue); font-size: 11px; letter-spacing: .08em; }

.orbe-caja { display: grid; place-items: center; padding: 26px 0 4px; }
.orbe {
  width: 150px; height: 150px; border-radius: 50%; position: relative;
  background:
    radial-gradient(circle at 50% 50%, #c9f4ff 0 6%, #3fd0ff 14%, #1b5fb0 38%, #0b1a3a 62%, transparent 70%);
  box-shadow: 0 0 40px #3fd0ff44, inset 0 0 30px #3fd0ff33;
  transition: transform .3s;
}
.orbe::before, .orbe::after {
  content: ""; position: absolute; inset: -10px; border-radius: 50%;
  border: 2px solid transparent; border-top-color: var(--acento); border-left-color: #3fd0ff55;
  animation: girar 6s linear infinite;
}
.orbe::after { inset: -22px; border-top-color: var(--acento-2); border-right-color: #7c6bff44; animation-duration: 10s; animation-direction: reverse; }
@keyframes girar { to { transform: rotate(360deg); } }
@keyframes latir { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
body.escuchando .orbe { animation: latir .9s ease-in-out infinite; box-shadow: 0 0 60px #3ee08f88, inset 0 0 30px #3ee08f55;
  background: radial-gradient(circle, #e2ffef 0 6%, #3ee08f 16%, #157a4f 40%, #07241a 62%, transparent 70%); }
body.hablando .orbe { animation: latir .5s ease-in-out infinite; }
body.ocupado .orbe::before { animation-duration: 1.2s; }
body.ocupado .orbe::after { animation-duration: 2s; }
.estado-texto { text-align: center; color: var(--tenue); font-size: 13px; min-height: 20px; margin-top: 34px; }

.seccion h2 { font-size: 11px; color: var(--tenue); letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; font-weight: 600; }
.acciones { display: grid; gap: 8px; }
.accion {
  display: flex; align-items: center; gap: 10px; text-align: left;
  background: var(--panel-2); border: 1px solid var(--borde); border-radius: 10px;
  padding: 10px 12px; transition: border-color .15s, background .15s;
}
.accion:hover { border-color: var(--acento); background: #15213b; }
.accion .ico { width: 22px; text-align: center; }

.indicadores { display: grid; gap: 6px; font-size: 13px; }
.ind { display: flex; align-items: center; gap: 8px; color: var(--tenue); }
.punto { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex: none; }
.punto.ok { background: var(--ok); }

.interruptor { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px; font-size: 14px; }
.interruptor input { display: none; }
.interruptor span.riel { width: 38px; height: 22px; border-radius: 22px; background: #263453; position: relative; transition: background .2s; flex: none; }
.interruptor span.riel::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .2s; }
.interruptor input:checked + span.riel { background: var(--acento); }
.interruptor input:checked + span.riel::after { left: 19px; }
.ayuda-mini { font-size: 12px; color: var(--tenue); margin: -2px 0 0; }

/* ---------- chat ---------- */
main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.cabecera {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 26px; border-bottom: 1px solid var(--borde); background: #0a1020cc; backdrop-filter: blur(8px);
}
.cabecera .titulo { font-weight: 600; }
.cabecera .sub { color: var(--tenue); font-size: 13px; }
.boton-ghost { background: transparent; border: 1px solid var(--borde); border-radius: 8px; padding: 6px 12px; color: var(--tenue); }
.boton-ghost:hover { color: var(--texto); border-color: var(--acento); }

#chat { flex: 1; overflow-y: auto; padding: 24px 26px 12px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
.msg { max-width: min(760px, 86%); padding: 12px 16px; border-radius: var(--radio); white-space: normal; word-wrap: break-word; animation: aparecer .2s ease-out; }
@keyframes aparecer { from { opacity: 0; transform: translateY(6px); } }
.msg.usuario { align-self: flex-end; background: var(--usuario); border-bottom-right-radius: 4px; }
.msg.jarvis { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--borde); border-bottom-left-radius: 4px; }
.msg.sistema { align-self: center; color: var(--aviso); font-size: 13px; background: transparent; }
.msg .hora { display: block; font-size: 11px; color: var(--tenue); margin-top: 6px; }
.msg p { margin: 0 0 8px; } .msg p:last-of-type { margin-bottom: 0; }
.msg ul, .msg ol { margin: 4px 0 8px; padding-left: 22px; }
.msg code { background: #0a1222; border: 1px solid var(--borde); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.msg pre { background: #0a1222; border: 1px solid var(--borde); padding: 10px; border-radius: 8px; overflow-x: auto; }
.msg pre code { border: 0; padding: 0; }
.msg strong { color: #fff; }
.msg h3 { margin: 6px 0; font-size: 15px; }

.pensando { align-self: flex-start; color: var(--tenue); font-size: 14px; display: none; align-items: center; gap: 10px; padding: 4px 4px; }
body.ocupado .pensando { display: flex; }
.puntos span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--acento); animation: rebote 1s infinite; }
.puntos span:nth-child(2) { animation-delay: .15s; } .puntos span:nth-child(3) { animation-delay: .3s; }
@keyframes rebote { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

/* ---------- entrada ---------- */
.entrada { padding: 14px 26px 22px; }
.caja {
  display: flex; align-items: flex-end; gap: 10px;
  background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; padding: 8px 8px 8px 16px;
}
.caja:focus-within { border-color: var(--acento); box-shadow: 0 0 0 3px #3fd0ff1f; }
textarea {
  flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--texto);
  font: inherit; max-height: 180px; padding: 8px 0;
}
.btn-redondo { width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; transition: transform .1s, background .2s; }
.btn-redondo:active { transform: scale(.94); }
#mic { background: #1a2742; }
#mic:hover { background: #22345a; }
body.escuchando #mic { background: var(--ok); color: #04210f; }
#enviar { background: linear-gradient(135deg, var(--acento), var(--acento-2)); color: #041022; }
.pista { color: var(--tenue); font-size: 12px; margin-top: 8px; padding-left: 4px; }
kbd { background: #1a2742; border-radius: 4px; padding: 0 5px; font-size: 11px; }

/* ---------- confirmación ---------- */
.velo { position: fixed; inset: 0; background: #02050ccc; display: none; place-items: center; z-index: 10; backdrop-filter: blur(3px); }
.velo.visible { display: grid; }
.dialogo { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--acento); border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px #000a; }
.dialogo h3 { margin: 0 0 10px; }
.dialogo pre { white-space: pre-wrap; background: #0a1222; border: 1px solid var(--borde); border-radius: 10px; padding: 12px; max-height: 50vh; overflow: auto; font: 13px/1.5 ui-monospace, Menlo, monospace; }
.botones { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
.btn { border-radius: 10px; padding: 9px 18px; border: 1px solid var(--borde); background: var(--panel-2); }
.btn.primario { background: var(--ok); color: #04210f; border-color: var(--ok); font-weight: 600; }

@media (max-width: 820px) {
  body { grid-template-columns: 1fr; }
  aside { display: none; }
  #chat, .entrada, .cabecera { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<aside>
  <div class="marca">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#3fd0ff" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#3fd0ff"/><path d="M17 2v6M17 26v6M2 17h6M26 17h6" stroke="#7c6bff" stroke-width="2"/></svg>
    <div><h1>JARVIS</h1><small>ASISTENTE DE TRABAJO</small></div>
  </div>

  <div class="orbe-caja">
    <div class="orbe" id="orbe" title="Clic para hablar"></div>
    <div class="estado-texto" id="estadoTexto">En línea</div>
  </div>

  <div class="seccion">
    <h2>Acciones rápidas</h2>
    <div class="acciones">
      <button class="accion" data-orden="Revisa mis correos no leídos y resúmelos por prioridad."><span class="ico">📥</span>Revisar correo</button>
      <button class="accion" data-orden="Mira mi pantalla y dime en qué me puedes ayudar con lo que tengo abierto."><span class="ico">🖥️</span>Ver mi pantalla</button>
      <button class="accion" id="validar"><span class="ico">✅</span>Validar un Excel…</button>
      <button class="accion" id="aprenderHoja"><span class="ico">🧠</span>Aprender de una hoja correcta…</button>
      <button class="accion" data-orden="Aprende de mis archivos de trabajo y dime qué encontraste y en qué he estado trabajando últimamente."><span class="ico">📚</span>Aprender de mis archivos</button>
      <button class="accion" data-orden="¿Qué recuerdas de mí y de mi trabajo?"><span class="ico">💡</span>¿Qué sabes de mí?</button>
    </div>
  </div>

  <div class="seccion">
    <h2>Voz</h2>
    <label class="interruptor">Responder en voz alta <input type="checkbox" id="vozActiva" checked><span class="riel"></span></label>
    <label class="interruptor">Manos libres <input type="checkbox" id="manosLibres"><span class="riel"></span></label>
    <p class="ayuda-mini">Con manos libres, di <b>“Jarvis, …”</b> y te escucho.</p>
  </div>

  <div class="seccion">
    <h2>Estado</h2>
    <div class="indicadores">
      <div class="ind"><span class="punto" id="pIa"></span><span id="tIa">Inteligencia</span></div>
      <div class="ind"><span class="punto" id="pCorreo"></span><span id="tCorreo">Correo</span></div>
      <div class="ind"><span class="punto ok"></span><span id="tMemoria">Memoria</span></div>
    </div>
  </div>
</aside>

<main>
  <div class="cabecera">
    <div><div class="titulo">Conversación</div><div class="sub" id="sub">Pídeme lo que necesites</div></div>
    <button class="boton-ghost" id="reiniciar" title="Empezar una conversación nueva">Nueva conversación</button>
  </div>
  <div id="chat">
    <div class="pensando" id="pensando"><span class="puntos"><span></span><span></span><span></span></span><span id="actividad">Pensando</span></div>
  </div>
  <div class="entrada">
    <div class="caja">
      <textarea id="texto" rows="1" placeholder="Escribe una orden… ej: “valida nomina.xlsx y envía el reporte a mi jefe”"></textarea>
      <button class="btn-redondo" id="mic" title="Hablar (⌘ + espacio dentro de JARVIS)" aria-label="Hablar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </button>
      <button class="btn-redondo" id="enviar" title="Enviar" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="pista"><kbd>Enter</kbd> enviar · <kbd>Shift</kbd>+<kbd>Enter</kbd> nueva línea · <kbd>⌘</kbd>+<kbd>K</kbd> hablar · <kbd>Esc</kbd> callar</div>
  </div>
</main>

<div class="velo" id="velo">
  <div class="dialogo">
    <h3>JARVIS necesita tu confirmación</h3>
    <pre id="confTexto"></pre>
    <div class="botones">
      <button class="btn" id="confNo">Cancelar</button>
      <button class="btn primario" id="confSi">Confirmar</button>
    </div>
  </div>
</div>

<script>
const TOKEN = "__TOKEN__";
const $ = (id) => document.getElementById(id);
let ultimoId = 0, confId = null;

async function api(ruta, datos) {
  const op = { headers: { "X-Jarvis-Token": TOKEN } };
  if (datos !== undefined) { op.method = "POST"; op.headers["Content-Type"] = "application/json"; op.body = JSON.stringify(datos); }
  const r = await fetch(ruta, op);
  return r.json();
}

function escapar(t) { return t.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function markdown(texto) {
  let t = escapar(texto);
  const bloques = [];
  t = t.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, c) => { bloques.push(c); return `\u0000${bloques.length - 1}\u0000`; });
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>")
       .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
       .replace(/^#{1,4}\s+(.+)$/gm, "<h3>$1</h3>");
  const lineas = t.split("\n"); let html = "", lista = null, parrafo = [];
  const cerrarP = () => { if (parrafo.length) { html += `<p>${parrafo.join("<br>")}</p>`; parrafo = []; } };
  const cerrarL = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  for (const l of lineas) {
    let m;
    if ((m = l.match(/^\s*[-•*]\s+(.*)/))) { cerrarP(); if (lista !== "ul") { cerrarL(); html += "<ul>"; lista = "ul"; } html += `<li>${m[1]}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { cerrarP(); if (lista !== "ol") { cerrarL(); html += "<ol>"; lista = "ol"; } html += `<li>${m[1]}</li>`; }
    else if (/^<h3>/.test(l)) { cerrarP(); cerrarL(); html += l; }
    else if (!l.trim()) { cerrarP(); cerrarL(); }
    else { cerrarL(); parrafo.push(l); }
  }
  cerrarP(); cerrarL();
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${bloques[i]}</code></pre>`);
}

function pintar(m) {
  const div = document.createElement("div");
  div.className = `msg ${m.rol}`;
  div.innerHTML = (m.rol === "usuario" ? `<p>${escapar(m.texto).replace(/\n/g, "<br>")}</p>` : markdown(m.texto)) + `<span class="hora">${m.hora}</span>`;
  $("chat").insertBefore(div, $("pensando"));
  $("chat").scrollTop = $("chat").scrollHeight;
}

async function actualizar() {
  try {
    const { mensajes } = await api(`/api/mensajes?desde=${ultimoId}`);
    for (const m of mensajes) { pintar(m); ultimoId = m.id; }
    const e = await api("/api/estado");
    document.body.classList.toggle("ocupado", e.ocupado);
    document.body.classList.toggle("escuchando", e.escuchando);
    document.body.classList.toggle("hablando", e.hablando);
    $("actividad").textContent = (e.actividad || "Pensando") + "…";
    $("estadoTexto").textContent = e.escuchando ? "Escuchando…" : e.hablando ? "Hablando…" : e.ocupado ? (e.actividad || "Pensando") + "…" : e.manos_libres ? "Di “Jarvis…”" : "En línea";
    $("pIa").classList.toggle("ok", e.ia); $("tIa").textContent = e.ia ? "Inteligencia activa" : "Sin clave de IA (modo básico)";
    $("pCorreo").classList.toggle("ok", e.correo); $("tCorreo").textContent = e.correo ? e.cuenta : "Correo sin configurar";
    $("tMemoria").textContent = `Memoria: ${e.memoria.notas} notas · ${e.memoria.perfiles} perfiles · ${e.memoria.archivos} archivos`;
    $("vozActiva").checked = e.voz_activa; $("manosLibres").checked = e.manos_libres;
    if (e.confirmacion && e.confirmacion.id !== confId) { confId = e.confirmacion.id; $("confTexto").textContent = e.confirmacion.texto; $("velo").classList.add("visible"); }
    if (!e.confirmacion && confId) { confId = null; $("velo").classList.remove("visible"); }
  } catch (err) { $("estadoTexto").textContent = "Reconectando…"; }
}

async function enviar(texto) {
  texto = (texto ?? $("texto").value).trim();
  if (!texto) return;
  $("texto").value = ""; ajustar();
  await api("/api/chat", { texto });
  actualizar();
}

async function hablar() {
  if (document.body.classList.contains("escuchando")) { await api("/api/detener", {}); return; }
  document.body.classList.add("escuchando"); $("estadoTexto").textContent = "Escuchando…";
  const r = await api("/api/escuchar", { enviar: true });
  document.body.classList.remove("escuchando");
  if (r.error) pintar({ rol: "sistema", texto: "Micrófono: " + r.error, hora: "" });
  else if (!r.texto) $("estadoTexto").textContent = "No te escuché";
  actualizar();
}

async function elegirY(prefijo) {
  const { ruta } = await api("/api/elegir_archivo", {});
  const archivo = ruta || prompt("Ruta completa del archivo Excel:");
  if (archivo) enviar(`${prefijo} "${archivo}"`);
}

function ajustar() { const t = $("texto"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }

$("texto").addEventListener("input", ajustar);
$("texto").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } });
$("enviar").onclick = () => enviar();
$("mic").onclick = hablar; $("orbe").onclick = hablar;
$("reiniciar").onclick = () => enviar("reiniciar");
$("validar").onclick = () => elegirY("Valida este Excel (usa un perfil aprendido si hay uno parecido) y dime qué está mal:");
$("aprenderHoja").onclick = () => elegirY("Esta hoja está correcta: aprende sus reglas de validación para usarlas después:");
document.querySelectorAll("[data-orden]").forEach(b => b.onclick = () => enviar(b.dataset.orden));
$("vozActiva").onchange = (e) => api("/api/ajustes", { voz_activa: e.target.checked });
$("manosLibres").onchange = (e) => api("/api/ajustes", { manos_libres: e.target.checked });
$("confSi").onclick = () => api("/api/confirmar", { id: confId, si: true }).then(actualizar);
$("confNo").onclick = () => api("/api/confirmar", { id: confId, si: false }).then(actualizar);
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); hablar(); }
  if (e.key === "Escape") api("/api/detener", {});
});

actualizar(); setInterval(actualizar, 700); $("texto").focus();
</script>
</body>
</html>
